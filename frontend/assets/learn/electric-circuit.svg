<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">A simple electric circuit</title>
  <desc id="d">A cell, closed switch, connecting wires and a glowing bulb form a series circuit. Labels mark the cell, switch and bulb.</desc>
  <rect width="760" height="430" rx="24" fill="#f4faf7"/>
  <g fill="none" stroke="#0e9f6e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 290V170h116"/>
    <path d="M402 170h176v120H458"/>
    <path d="M338 290h-68"/>
  </g>
  <g>
    <rect x="118" y="208" width="136" height="86" rx="12" fill="#142544"/>
    <rect x="140" y="230" width="90" height="42" rx="6" fill="#2c3d5c"/>
    <path d="M158 242h30M158 254h18" stroke="#ffd166" stroke-width="5" stroke-linecap="round"/>
    <text x="186" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#142544" text-anchor="middle">Cell / battery</text>
    <text x="186" y="348" font-family="Arial, sans-serif" font-size="13" fill="#61707d" text-anchor="middle">provides energy</text>
  </g>
  <g>
    <path d="M282 170l46-28" stroke="#61707d" stroke-width="7" stroke-linecap="round"/>
    <path d="M326 144l42 26" stroke="#0e9f6e" stroke-width="9" stroke-linecap="round"/>
    <circle cx="305" cy="152" r="7" fill="#61707d"/>
    <circle cx="346" cy="160" r="7" fill="#0e9f6e"/>
    <text x="317" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#142544" text-anchor="middle">Switch (closed)</text>
  </g>
  <g>
    <circle cx="578" cy="170" r="58" fill="#fff8d6" stroke="#e9a23b" stroke-width="8"/>
    <circle cx="578" cy="170" r="40" fill="#fff" stroke="#f2c56f" stroke-width="5"/>
    <path d="M556 170c8-18 36-18 44 0M578 152v-16M578 204v-16" stroke="#e9a23b" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#f2b01e" stroke-width="5" stroke-linecap="round">
      <path d="M578 82v-18M634 104l12-14M644 170h20M524 170h-20M532 104l-12-14"/>
    </g>
    <text x="578" y="270" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#142544" text-anchor="middle">Bulb (glowing)</text>
    <text x="578" y="292" font-family="Arial, sans-serif" font-size="13" fill="#61707d" text-anchor="middle">converts energy to light</text>
  </g>
  <g>
    <path d="M402 290v34" stroke="#4f7df3" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="402" y="354" font-family="Arial, sans-serif" font-size="14" fill="#4f7df3" text-anchor="middle">Wires connect the parts</text>
    <text x="376" y="382" font-family="Arial, sans-serif" font-size="13" fill="#61707d" text-anchor="middle">A closed path lets current flow and the bulb glows.</text>
  </g>
</svg>
