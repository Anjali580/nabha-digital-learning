<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Stages of crop production</title>
  <desc id="d">An illustrated farm sequence: ploughing, sowing seeds, irrigation, and harvesting with a tractor.</desc>
  <rect width="760" height="430" rx="24" fill="#f4fbf1"/>
  <circle cx="668" cy="78" r="38" fill="#ffe6a6"/>
  <circle cx="668" cy="78" r="56" fill="#ffe6a6" opacity=".2"/>
  <path d="M0 286c120-28 216-12 318 16s190 26 292-10 150-6 150-6v144H0z" fill="#cdeab3"/>
  <path d="M0 326c130-20 232-2 330 18s200 12 300-18 130-10 130-10v114H0z" fill="#9fd67c" opacity=".55"/>

  <!-- ploughing -->
  <g transform="translate(58 220)">
    <path d="M0 96h176" stroke="#b97c40" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 96c24-48 58-66 96-60" fill="none" stroke="#8b5e3c" stroke-width="8" stroke-linecap="round"/>
    <path d="M96 36v58" stroke="#61707d" stroke-width="5"/>
    <path d="M78 94l34 22-34 22z" fill="#64748b"/>
    <path d="M50 88l26-22M62 100l28-18" stroke="#8b5e3c" stroke-width="5" stroke-linecap="round"/>
    <text x="88" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#142544" text-anchor="middle">1. Ploughing</text>
  </g>

  <!-- sowing -->
  <g transform="translate(270 190)">
    <rect x="0" y="54" width="130" height="62" rx="10" fill="#d9825b"/>
    <path d="M0 70h130" stroke="#b9653f" stroke-width="4"/>
    <circle cx="28" cy="118" r="13" fill="#3a3a3a"/>
    <circle cx="102" cy="118" r="13" fill="#3a3a3a"/>
    <path d="M40 54c18-20 42-20 60 0" fill="#8b5e3c"/>
    <g fill="#e9a23b">
      <circle cx="20" cy="138" r="3"/><circle cx="46" cy="143" r="3"/><circle cx="74" cy="139" r="3"/><circle cx="104" cy="144" r="3"/>
    </g>
    <text x="65" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#142544" text-anchor="middle">2. Sowing</text>
  </g>

  <!-- irrigation -->
  <g transform="translate(456 176)">
    <path d="M22 136V66h104v70" fill="none" stroke="#4f7df3" stroke-width="7" stroke-linecap="round"/>
    <path d="M22 66c20-18 84-18 104 0" fill="none" stroke="#4f7df3" stroke-width="7"/>
    <path d="M48 136v-42M98 136v-42" stroke="#7ba1ff" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#4f7df3" stroke-width="4" stroke-linecap="round" opacity=".6">
      <path d="M32 160v14M52 164v16M74 168v14M96 164v16M116 160v14"/>
    </g>
    <text x="74" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#142544" text-anchor="middle">3. Irrigation</text>
  </g>

  <!-- harvesting -->
  <g transform="translate(572 226)">
    <rect x="0" y="16" width="92" height="54" rx="8" fill="#e9a23b"/>
    <rect x="20" y="-4" width="48" height="34" rx="6" fill="#f2c56f"/>
    <circle cx="20" cy="76" r="16" fill="#3a3a3a"/>
    <circle cx="70" cy="76" r="22" fill="#3a3a3a"/>
    <path d="M20 76h50" stroke="#64748b" stroke-width="5"/>
    <path d="M92 46h22v18H92z" fill="#64748b"/>
    <text x="46" y="124" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#142544" text-anchor="middle">4. Harvesting</text>
  </g>

  <g stroke="#0e9f6e" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M214 284h30M364 284h30M540 284h30"/>
  </g>
  <text x="380" y="398" font-family="Arial, sans-serif" font-size="13" fill="#61707d" text-anchor="middle">Good soil, clean seeds, the right water and timely harvesting protect the crop.</text>
</svg>
