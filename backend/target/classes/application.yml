server:
  port: ${PORT:8080}
  # Render terminates TLS at its proxy. This makes request.isSecure() true so
  # the auth cookie is issued as Secure + SameSite=None for cross-site use.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: NabhaLearn
  data:
    mongodb:
      # Local development uses the MongoDB instance on this machine. Production
      # (Render) must set MONGODB_URI to its Atlas connection string. Do not put
      # a remote cluster here as the default: if it is unreachable the backend
      # cannot start and every /api call from Live Server becomes a 500.
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/nabhaleam?serverSelectionTimeoutMS=5000}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:2h}

  auth:
    cookie-name: nl_token
    secure-cookie: ${SECURE_COOKIE:false}

  cors:
    # Comma-separated. SecurityConfig always merges the required Render and
    # localhost origins, so a stale dashboard value cannot lock users out.
    allowed-origins: ${CORS_ORIGINS:https://nabha-digital-learning-q5z8.onrender.com,https://nabha-digital-learning-backend.onrender.com,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}

  upload:
    dir: ${UPLOAD_DIR:uploads}
    max-size-bytes: 5242880
    allowed-content-types: application/pdf,image/jpeg,image/png,image/webp

  seed:
    enabled: ${SEED_ENABLED:true}

  demo:
    email: ${DEMO_STUDENT_EMAIL:student@nabhaleam.local}
    password: ${DEMO_STUDENT_PASSWORD:Student@12345}
    teacher-email: ${DEMO_TEACHER_EMAIL:teacher@nabhaleam.local}
    teacher-password: ${DEMO_TEACHER_PASSWORD:Teacher@12345}
    teacher-degree: ${DEMO_TEACHER_DEGREE:M.Sc., B.Ed.}
    admin-email: ${DEMO_ADMIN_EMAIL:admin@nabhaleam.local}
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@12345}
    admin-invite-code: ${ADMIN_INVITE_CODE:NABHA-ADMIN}

logging:
  level:
    root: INFO
    com.nabhaleam: INFO
    org.springframework.data.mongodb.core.MongoTemplate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
