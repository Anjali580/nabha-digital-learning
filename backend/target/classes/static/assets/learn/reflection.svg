<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">Reflection of light in a mirror</title>
  <desc id="d">A ray of light falls on a flat mirror and bounces away. The angle of incidence equals the angle of reflection.</desc>
  <rect width="760" height="430" rx="24" fill="#f5f8ff"/>
  <rect x="120" y="306" width="520" height="30" rx="8" fill="#b8c6d9"/>
  <rect x="120" y="296" width="520" height="12" rx="6" fill="#dbe8f6"/>
  <path d="M120 296l520-18" stroke="#4f7df3" stroke-width="4" opacity=".4"/>
  <g stroke-linecap="round">
    <path d="M252 190l94 102" stroke="#e9a23b" stroke-width="9"/>
    <path d="M380 214l104-30" stroke="#f2994a" stroke-width="9"/>
    <path d="M380 214v-124" stroke="#61707d" stroke-width="4" stroke-dasharray="7 7"/>
  </g>
  <circle cx="380" cy="214" r="10" fill="#e9a23b"/>
  <path d="M330 236l-14-3 8-12z" fill="#e9a23b"/>
  <path d="M468 190l14 4-9 11z" fill="#f2994a"/>
  <text x="267" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#142544">Incident ray</text>
  <text x="455" y="164" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#142544">Reflected ray</text>
  <text x="394" y="112" font-family="Arial, sans-serif" font-size="14" fill="#61707d">Normal</text>
  <path d="M352 232a34 34 0 0 0 6-36" fill="none" stroke="#0e9f6e" stroke-width="4"/>
  <text x="332" y="272" font-family="Arial, sans-serif" font-size="14" fill="#0e9f6e" font-weight="700">i</text>
  <path d="M414 230a34 34 0 0 1 12-32" fill="none" stroke="#8367e8" stroke-width="4"/>
  <text x="440" y="270" font-family="Arial, sans-serif" font-size="14" fill="#8367e8" font-weight="700">r</text>
  <text x="380" y="368" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#142544" text-anchor="middle">Angle of incidence (i) = angle of reflection (r)</text>
  <text x="380" y="392" font-family="Arial, sans-serif" font-size="13" fill="#61707d" text-anchor="middle">Both angles are measured from the normal, not the mirror.</text>
</svg>
