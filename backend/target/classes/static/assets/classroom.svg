<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">A bright village classroom</title>
  <desc id="desc">A teacher points to a green chalkboard while three students learn together at a wooden desk with books and a tablet.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fbf6"/>
      <stop offset="1" stop-color="#e2f0ff"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f4f1e6"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15795a"/>
      <stop offset="1" stop-color="#0c5b42"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a366"/>
      <stop offset="1" stop-color="#b97c40"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc695"/>
      <stop offset="1" stop-color="#0e9f6e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14312a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="620" rx="32" fill="url(#sky)"/>
  <circle cx="682" cy="102" r="34" fill="#ffe6a6"/>
  <circle cx="682" cy="102" r="52" fill="#ffe6a6" opacity=".22"/>

  <!-- wall + floor -->
  <rect x="34" y="48" width="732" height="520" rx="26" fill="url(#wall)"/>
  <path d="M34 470h732v72a26 26 0 0 1-26 26H60a26 26 0 0 1-26-26z" fill="#efe6d1"/>
  <path d="M34 470h732" stroke="#e3d7bd" stroke-width="4"/>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="604" y="86" width="132" height="142" rx="14" fill="#dff2ff" stroke="#c7dce7" stroke-width="5"/>
    <path d="M670 90v134M608 160h124" stroke="#c7dce7" stroke-width="5"/>
    <path d="M620 196c10-22 24-32 40-32s30 10 40 32" fill="#bfe6c9"/>
    <circle cx="648" cy="126" r="13" fill="#ffe6a6"/>
  </g>

  <!-- board -->
  <g filter="url(#soft)">
    <rect x="84" y="92" width="466" height="252" rx="18" fill="#c58b4f"/>
    <rect x="94" y="102" width="446" height="232" rx="12" fill="url(#board)"/>
    <path d="M128 152h164M128 184h118M128 216h144" stroke="#c9f4df" stroke-width="9" stroke-linecap="round" opacity=".92"/>
    <path d="M340 158l24 22-24 22M374 202h54" stroke="#ffe6a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <circle cx="474" cy="132" r="15" fill="#f7f3e8" opacity=".16"/>
    <path d="M128 258h94" stroke="#8ff0c8" stroke-width="7" stroke-linecap="round" opacity=".65"/>
    <rect x="100" y="338" width="434" height="14" rx="7" fill="#b97c40"/>
  </g>

  <!-- teacher -->
  <g filter="url(#soft)">
    <circle cx="592" cy="238" r="34" fill="#f2c7a5"/>
    <path d="M556 234c0-24 16-42 36-42s36 18 36 42c0 7-4 10-9 6-8-6-17-9-27-9s-19 3-27 9c-5 4-9 1-9-6z" fill="#2b2a33"/>
    <path d="M556 366c0-47 16-76 36-76s36 29 36 76z" fill="url(#shirt)"/>
    <path d="M572 320l-34 52" stroke="#f2c7a5" stroke-width="15" stroke-linecap="round"/>
    <path d="M572 320l38 36" stroke="#f2c7a5" stroke-width="15" stroke-linecap="round"/>
    <path d="M574 300h36l8 66h-52z" fill="#0b835b"/>
    <circle cx="592" cy="242" r="3.4" fill="#2b2a33"/>
    <path d="M588 256c4 4 9 4 13 0" stroke="#b97558" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <g filter="url(#soft)">
    <rect x="168" y="386" width="388" height="30" rx="15" fill="url(#desk)"/>
    <rect x="198" y="414" width="18" height="126" rx="8" fill="#a76c34"/>
    <rect x="506" y="414" width="18" height="126" rx="8" fill="#a76c34"/>
    <rect x="356" y="414" width="16" height="118" rx="7" fill="#a76c34" opacity=".6"/>
  </g>

  <!-- students -->
  <g filter="url(#soft)">
    <!-- left student -->
    <circle cx="262" cy="332" r="28" fill="#9b5f3f"/>
    <path d="M236 328c0-20 12-34 26-34s26 14 26 34c0 8-4 10-9 5-6-6-11-8-17-8s-11 2-17 8c-5 5-9 3-9-5z" fill="#241f1b"/>
    <path d="M228 386c0-30 15-46 34-46s34 16 34 46z" fill="#ffd8a8"/>
    <path d="M244 352l-16 22M280 352l16 22" stroke="#f2c7a5" stroke-width="11" stroke-linecap="round"/>
    <circle cx="253" cy="336" r="2.6" fill="#2b2a33"/>
    <circle cx="271" cy="336" r="2.6" fill="#2b2a33"/>
    <!-- middle student -->
    <circle cx="362" cy="320" r="31" fill="#d99b70"/>
    <path d="M332 320c0-23 14-39 30-39s30 16 30 39c0 8-5 9-10 4-6-6-12-8-20-8s-14 2-20 8c-5 5-10 4-10-4z" fill="#1f2a44"/>
    <path d="M326 386c0-34 16-50 36-50s36 16 36 50z" fill="#4f7df3"/>
    <path d="M346 345l-14 24M378 345l14 24" stroke="#f2c7a5" stroke-width="11" stroke-linecap="round"/>
    <circle cx="352" cy="324" r="2.6" fill="#2b2a33"/>
    <circle cx="372" cy="324" r="2.6" fill="#2b2a33"/>
    <path d="M356 338c4 4 8 4 12 0" stroke="#9e5e43" stroke-width="3" stroke-linecap="round"/>
    <!-- right student -->
    <circle cx="466" cy="334" r="28" fill="#f0c3a0"/>
    <path d="M440 334c0-22 12-36 26-36s26 14 26 36c0 6-2 9-7 7-5-2-11-3-19-3s-14 1-19 3c-5 2-7-1-7-7z" fill="#3a2a22"/>
    <path d="M432 386c0-30 15-46 34-46s34 16 34 46z" fill="#f2994a"/>
    <path d="M449 352l-16 22M483 352l16 22" stroke="#f2c7a5" stroke-width="11" stroke-linecap="round"/>
    <circle cx="457" cy="338" r="2.6" fill="#2b2a33"/>
    <circle cx="475" cy="338" r="2.6" fill="#2b2a33"/>
    <path d="M461 350c3 4 7 4 10 0" stroke="#b97558" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- desk items -->
  <g>
    <rect x="206" y="364" width="55" height="22" rx="3" fill="#7da3ff"/>
    <rect x="210" y="360" width="47" height="8" rx="3" fill="#bcd0ff"/>
    <rect x="470" y="356" width="58" height="30" rx="5" fill="#142544"/>
    <rect x="475" y="361" width="48" height="19" rx="3" fill="#dff7ec"/>
    <path d="M486 368h22M486 374h14" stroke="#0e9f6e" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="300" y="370" width="9" height="18" rx="3" fill="#e9a23b"/>
    <path d="M304 370v-10" stroke="#8367e8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M90 500h54l-8 52H98z" fill="#d9825b"/>
    <path d="M117 500c0-30-16-44-30-48 2 24 12 40 30 48z" fill="#2fa36b"/>
    <path d="M117 500c0-36 18-50 34-54-2 28-14 46-34 54z" fill="#3fc695"/>
    <path d="M117 500v-62" stroke="#0e9f6e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- floating doodles -->
  <g opacity=".9">
    <g transform="translate(664 306)">
      <circle r="28" fill="#fff" stroke="#e2ebe6"/>
      <path d="M-10 0l7 8L12-9" fill="none" stroke="#0e9f6e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(132 236)">
      <rect x="-25" y="-20" width="50" height="42" rx="10" fill="#fff" stroke="#e2ebe6"/>
      <path d="M-12-4l9 8-9 8M6-4h10" fill="none" stroke="#8367e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(676 420)">
      <path d="M0-22l6 13 14 2-10 10 3 14L0 11l-13 6 3-14-10-10 14-2z" fill="#ffe6a6"/>
    </g>
  </g>

  <!-- chalk texture -->
  <g opacity=".06" fill="#fff">
    <circle cx="520" cy="250" r="2"/><circle cx="548" cy="120" r="1.5"/><circle cx="700" cy="250" r="2"/>
  </g>
</svg>
