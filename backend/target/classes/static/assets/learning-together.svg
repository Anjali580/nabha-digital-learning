<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Learning together in the village</title>
  <desc id="desc">Two students share a tablet under a tree while books, a globe and a school building sit in the background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8faf1"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e2c5"/>
      <stop offset="1" stop-color="#6ec79f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14312a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="760" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="632" cy="92" r="42" fill="#ffe6a6"/>
  <circle cx="632" cy="92" r="64" fill="#ffe6a6" opacity=".22"/>
  <path d="M0 408c90-64 158-44 236-8s138 42 224 0 138-36 220 6 80 26 80 26v128H0z" fill="url(#hill)" opacity=".5"/>
  <path d="M0 452c108-52 180-24 262 4s154 30 236-12 166-30 262 8v108H0z" fill="#3fc695" opacity=".28"/>

  <!-- school -->
  <g filter="url(#sh)">
    <rect x="76" y="236" width="190" height="132" rx="10" fill="#fffdf7"/>
    <path d="M64 238l107-64 107 64z" fill="#d9825b"/>
    <rect x="150" y="294" width="42" height="74" rx="4" fill="#7b5a42"/>
    <rect x="98" y="272" width="34" height="34" rx="5" fill="#cfe9fb"/>
    <rect x="208" y="272" width="34" height="34" rx="5" fill="#cfe9fb"/>
    <path d="M171 174v-34h14v44" fill="#f2b85c"/>
    <path d="M185 140h28l-8 12 8 12h-28z" fill="#e9a23b"/>
  </g>

  <!-- tree -->
  <g>
    <path d="M614 408V286" stroke="#8b5e3c" stroke-width="20" stroke-linecap="round"/>
    <path d="M614 330l-44-40M614 310l42-44" stroke="#8b5e3c" stroke-width="13" stroke-linecap="round"/>
    <circle cx="570" cy="256" r="52" fill="#2fa36b"/>
    <circle cx="626" cy="230" r="62" fill="#3fc695"/>
    <circle cx="676" cy="270" r="46" fill="#2fa36b"/>
    <circle cx="610" cy="286" r="54" fill="#35b87f"/>
  </g>

  <!-- students -->
  <g filter="url(#sh)">
    <circle cx="344" cy="300" r="30" fill="#d99b70"/>
    <path d="M314 300c0-22 13-38 30-38s30 16 30 38c0 8-5 9-10 4-6-6-12-8-20-8s-14 2-20 8c-5 5-10 4-10-4z" fill="#1f2a44"/>
    <path d="M306 398c0-42 17-64 38-64s38 22 38 64z" fill="#4f7df3"/>
    <path d="M326 352l-20 30M368 352l20 30" stroke="#f2c7a5" stroke-width="13" stroke-linecap="round"/>
    <circle cx="334" cy="304" r="2.8" fill="#2b2a33"/>
    <circle cx="354" cy="304" r="2.8" fill="#2b2a33"/>

    <circle cx="432" cy="318" r="27" fill="#f0c3a0"/>
    <path d="M406 318c0-20 11-34 26-34s26 14 26 34c0 6-3 8-8 5-5-3-11-4-18-4s-13 1-18 4c-5 3-8 1-8-5z" fill="#3a2a22"/>
    <path d="M398 404c0-38 15-58 34-58s34 20 34 58z" fill="#f2994a"/>
    <path d="M416 360l-16 26M450 360l16 26" stroke="#f2c7a5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="423" cy="322" r="2.6" fill="#2b2a33"/>
    <circle cx="441" cy="322" r="2.6" fill="#2b2a33"/>
  </g>

  <!-- tablet / books -->
  <g filter="url(#sh)">
    <rect x="352" y="352" width="86" height="62" rx="8" fill="#142544" transform="rotate(-6 395 383)"/>
    <rect x="359" y="359" width="72" height="44" rx="4" fill="#dff7ec" transform="rotate(-6 395 383)"/>
    <path d="M372 376h34M372 386h22" stroke="#0e9f6e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="142" y="430" width="72" height="16" rx="4" fill="#7da3ff"/>
    <rect x="150" y="414" width="62" height="16" rx="4" fill="#f2994a"/>
    <rect x="158" y="398" width="52" height="16" rx="4" fill="#3fc695"/>
    <circle cx="552" cy="444" r="28" fill="#fff" stroke="#cfe9e0" stroke-width="4"/>
    <path d="M528 444h48M552 420c10 12 10 36 0 48M552 420c-10 12-10 36 0 48" fill="none" stroke="#4f7df3" stroke-width="4"/>
    <path d="M530 432h44M530 456h44" stroke="#4f7df3" stroke-width="3"/>
  </g>

  <!-- floaters -->
  <g opacity=".9">
    <g transform="translate(258 164)">
      <rect x="-24" y="-18" width="48" height="36" rx="10" fill="#fff" stroke="#dcebe4"/>
      <path d="M-10 0l7 8L12-9" fill="none" stroke="#0e9f6e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(492 142)">
      <path d="M0-16l4.5 9.5 10.5 1.5-7.5 7.5 2 10.5L0 8.5l-9.5 4.5 2-10.5L-15-5l10.5-1.5z" fill="#8367e8" opacity=".75"/>
    </g>
    <g transform="translate(300 104)">
      <circle r="20" fill="#fff" stroke="#dcebe4"/>
      <path d="M-6 2l5 5 8-11" fill="none" stroke="#f2994a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
